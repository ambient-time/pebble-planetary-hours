 * ClocksCore/Astro.swift — keep them identical (see ASTRO_CONSTANTS.md).
 * Longitude east-positive; angles in degrees; all math in UTC. sunrise/sunset

 * Attaches a global `Astro`. Load with:
 *   <script src="/clocks/shared/astro.js"><\/script>

  var SYNODIC_MONTH = 29.530588853;      // mean lunation (days)
  var NEW_MOON_JD = 2451550.1;           // 2000-01-06 18:14 UTC, year-agnostic
  var JD_UNIX_EPOCH = 2440587.5;
  var DEG = Math.PI / 180;

  function julianDay(date) {
    return date.getTime() / 86400000 + JD_UNIX_EPOCH;

    if (L0 < 0) L0 += 360;

    var e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
    var mr = M * DEG;
    var C = Math.sin(mr) * (1.914602 - T * (0.004817 + 0.000014 * T)) +
      Math.sin(2 * mr) * (0.019993 - 0.000101 * T) + Math.sin(3 * mr) * 0.000289;
    var trueLong = L0 + C;
    var omega = 125.04 - 1934.136 * T;
    var lambda = trueLong - 0.00569 - 0.00478 * Math.sin(omega * DEG);
    var secondsOb = 21.448 - T * (46.815 + T * (0.00059 - T * 0.001813));
    var obliq = (23 + (26 + secondsOb / 60) / 60 + 0.00256 * Math.cos(omega * DEG)) * DEG;
    var decl = Math.asin(Math.sin(obliq) * Math.sin(lambda * DEG)) / DEG;
    var y = Math.tan(obliq / 2); y *= y;
    var L0r = L0 * DEG;

      4 * e * y * Math.sin(mr) * Math.cos(2 * L0r) -
      0.5 * y * y * Math.sin(4 * L0r) - 1.25 * e * e * Math.sin(2 * mr));

    var trueSolar = (((utcMinutes + t.equationOfTime + 4 * lon) % 1440) + 1440) % 1440;
    var hourAngle = (trueSolar / 4 - 180) * DEG;

      Math.cos(phi) * Math.cos(declR) * Math.cos(hourAngle)) / DEG;

    if (p < 0.3125) return 'First Quarter';
    if (p < 0.4375) return 'Waxing Gibbous';
    if (p < 0.5625) return 'Full Moon';
    if (p < 0.6875) return 'Waning Gibbous';

    'Libra', 'Scorpio', 'Sagittarius', 'Capricorn', 'Aquarius', 'Pisces'];

    SYNODIC_MONTH: SYNODIC_MONTH,
    NEW_MOON_JD: NEW_MOON_JD,

/* FetchCache: tiny dependency-free helpers for the Ephemeris clocks (weather,
 * astro, tide). Extracts the versioned-localStorage cache, geolocation, and
 * timed-fetch patterns that were inlined in tide/index.html and cosmic/.
 *
 * Attaches a global `FetchCache`. Load with:
 *   <script src="/clocks/shared/fetch-cache.js"><\/script>
 *
 * Everything is fail-safe: a thrown/blocked localStorage, a denied geolocation,
 * or a network error never rejects the way that would blank a clock. Callers
 * still get a usable value (cached, default, or null) and decide how to render.

  // always has *some* honest place to show rather than NaN.
  var DEFAULT_LOCATION = { lat: 40.7128, lon: -74.0060, label: 'New York', source: 'default' };

  // Manual override: set localStorage['clocks.location'] to a JSON object like
  //   {"lat":51.5,"lon":-0.12,"label":"London"}
  // and every Ephemeris clock will use it instead of asking the browser.
  var OVERRIDE_KEY = 'clocks.location';
